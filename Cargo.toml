[package]
name = "tabulite"
version = "1.0.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
duckdb = "1"
calamine = "0.36"
gpui-kit = "0.6"
anyhow = "1"
log = "0.4.29"
toml = "1.1"
serde = { version = "1.0", features = ["derive"] }
dirs = "6"
env_logger = "0.11"

[dev-dependencies]
serial_test = "4"
zip = { version = "6", default-features = false, features = ["deflate-flate2"] }
